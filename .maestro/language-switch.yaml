appId: com.odysseyjournal.app
name: Language switch - every supported language
tags:
  - i18n
---
# Walks through all twelve languages and screenshots the feed, the map and the profile in
# each one. Reviewing the screenshots side by side is the fastest way to spot a string that
# did not change language, or one that came out blank.
#
# Taps use testIDs (settings-language-selector, language-option-<code>) on purpose: every
# visible label changes with the language under test, so tapping by text would break as soon
# as the flow does its job.
#
# Run: maestro test .maestro/language-switch.yaml
#      screenshots land next to the flow as lang-<code>-<screen>.png

- launchApp

# Login is tapped by testID for the same reason the language switch is: the field labels
# are translated, so tapping "Email or Username" only works while the app is in English -
# which is exactly the state this flow exists to leave.
# Skipped when the app resumes an existing session, which is the normal case on a device
# the flow has already run on.
- runFlow:
    when:
      visible:
        id: "login-email"
    commands:
      - tapOn:
          id: "login-email"
      - inputText: "explorer@odyssey.com"
      - tapOn:
          id: "login-password"
      - inputText: "OdysseyPassword123!"
      - tapOn:
          id: "login-submit"

- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: tr
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: en
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: es
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: fr
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: de
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: pt
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: it
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: ru
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: ja
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: ko
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: zh
- runFlow:
    file: subflows/switch-language.yaml
    env:
      LANG_CODE: ar
