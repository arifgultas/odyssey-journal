name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # The production build is deliberately manual - see the build-production job below.
  workflow_dispatch:
    inputs:
      production_build:
        description: Also run the EAS production build
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci --forceExit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  i18n:
    name: Translation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails when a locale is missing a key, still holds the English value, drops an
      # interpolation placeholder, or when user-visible text never goes through t() at
      # all - the causes of stray untranslated text in the app.
      - name: Check translations
        run: npm run i18n:check

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck --exclude supabase/functions
        continue-on-error: true

  build-preview:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: eas build --platform android --profile preview --non-interactive

  # Deliberately not run on every push. A production build takes about six minutes of CI
  # for an artifact nobody collects unless a release is actually being cut, and when it is
  # broken - as it was for five commits - every unrelated commit inherits a red run.
  # Start it from the Actions tab: Run workflow, with "Also run the EAS production build".
  build-production:
    name: EAS Production Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch' && inputs.production_build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: eas build --platform android --profile production --non-interactive
