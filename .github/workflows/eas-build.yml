name: Expo EAS CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Preview APKs are built on demand only - a push to main used to queue one nobody installed.
  workflow_dispatch:

jobs:
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Jest Tests
        run: npm run test

  build_preview:
    name: Trigger EAS Build Preview
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Run EAS Build Preview (Android)
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait
