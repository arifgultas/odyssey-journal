name: Deploy Supabase

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
  # Manual run, e.g. to check the workflow itself after an action upgrade. With no new
  # migrations `db push` is a no-op; it still waits for the production approval.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Changes production. The 'production' environment requires an approval in GitHub
    # (Actions -> this run -> Review deployments) before the job starts, and only main may deploy.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned so a new CLI release cannot change how migrations are applied without us noticing
          version: 2.117.0

      - name: Link Supabase Project
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"

      - name: Deploy Database Migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy

